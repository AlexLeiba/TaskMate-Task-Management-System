name: Build, Test and Deploy to Vercel

on:
  push:
    branches: [ workflow, staging, master ]

  pull_request:
    types: [ opened, reopened, closed ]
    branches: [ staging, master ]

jobs:
  install:
    runs-on: ubuntu-latest #type of machine to run the job on.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 #cloning the repo

      - name: Setup Node
        uses: actions/setup-node@v4 #installing node
        with:
          #additional node settings
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm i

  #   component-tests:
  #     runs-on: ubuntu-latest
  #     needs: install
  #     steps:
  #       - uses: actions/checkout@v4
  #
  #       - uses: actions/setup-node@v4
  #         with:
  #           node-version: 22
  #           cache: npm
  #
  #       - run: npm i
  #
  #       - name: Run Cypress Unit Tests
  #         uses: cypress-io/github-action@v6
  #         with:
  #           component: true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: install
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        with:
          start: npm run dev
          wait-on: "http://localhost:3000"
          browser: chrome

  build:
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm i

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .next

      - name: Deploy
        run: echo "Deploy now"
